services:
  nodeapp:
    build:
      context: .
    container_name: book_my_show
    ports:
      - '5000:3000'
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres
    container_name: bms_postgres
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - './data:/var/lib/postgresql/data'
      - './dumps:/dumps'
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine
    container_name: bms_redis
    ports:
      - 6379:6379
