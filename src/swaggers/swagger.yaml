openapi: 3.0.0
info:
  title: book-my-show
  version: 1.0.0
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: user
  - name: city
  - name: theater
  - name: movie
  - name: show
  - name: booking
  - name: transaction
paths:
  /api/auth/register:
    post:
      tags:
        - auth
      summary: register-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Ronny
                email: Ronny2@mailinator.com
                password: Ronny@1234
                phone: '88056468944'
                roles:
                  - Customer
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/send-otp:
    post:
      tags:
        - auth
      summary: send-otp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: yogita@mailinator.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/verify-otp:
    post:
      tags:
        - auth
      summary: verify-otp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: yogita@mailinator.com
                otp: '703402'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/login:
    post:
      tags:
        - auth
      summary: login-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: yashgupta@gkmit.co
                password: Yashg@9414
      responses:
