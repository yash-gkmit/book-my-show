openapi: 3.0.0
info:
  title: book-my-show
  version: 1.0.0
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: user
  - name: city
  - name: theater
  - name: movie
  - name: show
  - name: booking
  - name: transaction
