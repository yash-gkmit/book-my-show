openapi: 3.0.0
info:
  title: book-my-show
  version: 1.0.0
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: user
  - name: city
  - name: theater
  - name: movie
  - name: show
  - name: booking
  - name: transaction
paths:
  /api/auth/register:
    post:
      tags:
        - auth
      summary: register-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: jkjgy
                email: fgh7@gmail.com
                password: Shtybh@1234
                phone: '9877346008'
                roles:
                  - Customer
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/send-otp:
    post:
      tags:
        - auth
      summary: send-otp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: fgh7@gmail.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/verify-otp:
    post:
      tags:
        - auth
      summary: verify-otp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: adityasinghrajawat393@gmail.com
                otp: '791302'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/login:
    post:
      tags:
        - auth
      summary: login-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: adityasinghrajawat393@gmail.com
                role: Theater Owner
                password: Aditya@1234
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      responses:
