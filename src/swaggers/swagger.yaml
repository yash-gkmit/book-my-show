  /api/auth/register:
    post:
      tags:
        - auth
      summary: register-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Munnendra Gandhi
                email: begupta7225@gmail.com
                password: Munna@1234
                phone: '9876543210'
                roles:
                  - Theater Owner
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/send-otp:
    post:
      tags:
        - auth
      summary: send-otp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: khannaaakriti@gmail.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /api/auth/verify-otp:
    post:
      tags:
        - auth
      summary: verify-otp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: fgh7@gmail.com
                otp: '352040'
      parameters:
        - name: authorization
          in: header
          schema:
            type: string
          example: >-
            bearer
